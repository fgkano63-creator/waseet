<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="maBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E28"/>
      <stop offset="100%" stop-color="#0A1017"/>
    </linearGradient>
    <linearGradient id="maOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#maBg)" stroke="#FF5722" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Morocco Flag Badge -->
  <circle cx="95" cy="25" r="14" fill="#C1272D"/>
  <polygon points="95,16 97,22 103,22 98,26 100,32 95,28 90,32 92,26 87,22 93,22" fill="none" stroke="#006233" stroke-width="1.8"/>
  
  <!-- CIH / Cash Plus Card Graphic -->
  <rect x="20" y="38" width="80" height="52" rx="8" fill="#1A2D42" stroke="#2B4666" stroke-width="1.5"/>
  <!-- Card magnetic chip -->
  <rect x="30" y="48" width="16" height="12" rx="2" fill="#E5A93C"/>
  <!-- CIH Orange Stripe / Brand Element -->
  <path d="M72 45 Q82 45 88 51 Q94 57 94 67 Q94 77 88 83 Q82 89 72 89" fill="none" stroke="url(#maOrange)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Brand Text -->
  <text x="30" y="80" font-family="'Cairo', sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" letter-spacing="0.5">CIH</text>
  <text x="60" y="80" font-family="'Cairo', sans-serif" font-weight="700" font-size="10" fill="#FF5722">BANK</text>
</svg>