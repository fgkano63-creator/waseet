<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="cryptoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cryptoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#cryptoBg)"/>
  <!-- Glowing Tether / Crypto Coin Emblem -->
  <g transform="translate(320, 240)">
    <circle r="140" fill="none" stroke="url(#cryptoGrad)" stroke-width="12" stroke-dasharray="16 10"/>
    <circle r="115" fill="#1e293b" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.6"/>
    <!-- Tether / Currency "T" Symbol -->
    <path d="M-60,-50 L60,-50 L60,-20 L20,-20 L20,65 L-20,65 L-20,-20 L-60,-20 Z" fill="url(#cryptoGrad)"/>
    <ellipse cx="0" cy="5" rx="55" ry="16" fill="none" stroke="#22c55e" stroke-width="8"/>
  </g>
</svg>
