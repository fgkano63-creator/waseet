<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASEET | لوحة اختبارات أمان Google OAuth</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Rajdhani:wght@600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom 3D Design Styles -->
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .test-dashboard {
            max-width: 900px;
            margin: 2.5rem auto;
            padding: 2rem;
            background: linear-gradient(145deg, #121522, #0a0c13);
            border: 1px solid var(--border-metal);
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.9);
        }
        .test-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.2rem;
            background: rgba(14, 18, 28, 0.7);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            margin-bottom: 0.8rem;
            transition: all 0.2s ease;
        }
        .test-row:hover {
            border-color: var(--gold-primary);
        }
        .badge-pass {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
            padding: 4px 12px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 0.8rem;
            font-family: var(--font-en);
        }
        .badge-fail {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 4px 12px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 0.8rem;
            font-family: var(--font-en);
        }
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .stat-box {
            background: rgba(22, 27, 43, 0.6);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 1rem;
        }
    </style>
</head>
<body>

    <div class="test-dashboard">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h2 style="color: #fff; font-size: 1.6rem; font-weight: 800; display: flex; align-items: center; gap: 0.6rem;">
                    <i class="fas fa-vial text-gold"></i>
                    نتائج اختبارات الأمان: Google OAuth & PKCE
                </h2>
                <p style="color: var(--silver-muted); font-size: 0.88rem; margin-top: 0.3rem;">
                    فحص حماية State Mismatch و Redirect Tampering والتحقق من النطاقات المحدودة (email profile).
                </p>
            </div>
            <button class="btn-3d btn-gold" onclick="runTests()">
                <i class="fas fa-play"></i> إعادة تشغيل الاختبارات
            </button>
        </div>

        <div class="stats-summary">
            <div class="stat-box">
                <div style="color: var(--silver-muted); font-size: 0.8rem;">إجمالي الاختبارات</div>
                <div style="font-size: 2rem; font-weight: 900; font-family: var(--font-en); color: #fff;" id="stat-total">0</div>
            </div>
            <div class="stat-box">
                <div style="color: #10b981; font-size: 0.8rem;">ناجحة (PASS)</div>
                <div style="font-size: 2rem; font-weight: 900; font-family: var(--font-en); color: #10b981;" id="stat-passed">0</div>
            </div>
            <div class="stat-box">
                <div style="color: #ef4444; font-size: 0.8rem;">فاشلة (FAIL)</div>
                <div style="font-size: 2rem; font-weight: 900; font-family: var(--font-en); color: #ef4444;" id="stat-failed">0</div>
            </div>
        </div>

        <div id="tests-list-container">
            <!-- Results rendered dynamically -->
        </div>

        <div style="margin-top: 2rem; text-align: center;">
            <a href="../index.html" class="btn-3d btn-outline">
                <i class="fas fa-store"></i> العودة إلى منصة WASEET
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="auth-tests.js"></script>

    <script>
        async function runTests() {
            const suite = new AuthTestSuite();
            const results = await suite.runAllTests();

            document.getElementById('stat-total').innerText = results.total;
            document.getElementById('stat-passed').innerText = results.passed;
            document.getElementById('stat-failed').innerText = results.failed;

            const listEl = document.getElementById('tests-list-container');
            listEl.innerHTML = results.results.map(r => `
                <div class="test-row">
                    <div>
                        <div style="font-weight: 700; color: #fff; font-size: 0.95rem; margin-bottom: 0.2rem;">
                            <i class="${r.status === 'PASS' ? 'fas fa-check-circle text-gold' : 'fas fa-times-circle text-orange'}"></i>
                            ${r.name}
                        </div>
                        <div style="font-size: 0.82rem; color: var(--silver-muted); font-family: var(--font-en); direction: ltr; text-align: right;">
                            ${r.details}
                        </div>
                    </div>
                    <span class="${r.status === 'PASS' ? 'badge-pass' : 'badge-fail'}">
                        ${r.status}
                    </span>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
