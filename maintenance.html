<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصيانة | وسيط - WASEET</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <!-- Favicon / أيقونة الموقع وشعار وسيط الناري -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png?v=20261026_v2">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png?v=20261026_v2">
    <link rel="icon" type="image/x-icon" href="/assets/favicons/favicon.ico?v=20261026_v2">
    <link rel="shortcut icon" type="image/x-icon" href="/assets/favicons/favicon.ico?v=20261026_v2">
    <link rel="apple-touch-icon" href="/assets/favicons/apple-touch-icon.png?v=20261026_v2">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png?v=20261026_v2">
    <meta name="theme-color" content="#000000">

    <style>
        :root {
            --bg-black: #000000;
            --gold-primary: #c5a059;
            --gold-light: #dfb76c;
            --orange-primary: #ea580c;
            --orange-bright: #ff6a00;
            --text-white: #f8fafc;
            --text-muted: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Tajawal', 'Cairo', system-ui, -apple-system, sans-serif;
            direction: rtl;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* إضاءة محيطية خفيفة جداً بهوية وسيط الذهبية والبرتقالية */
        body::before {
            content: "";
            position: absolute;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(234, 88, 12, 0.08) 0%, rgba(197, 160, 89, 0.05) 40%, rgba(0, 0, 0, 0) 72%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .maintenance-wrapper {
            position: relative;
            z-index: 1;
            max-width: 620px;
            width: 100%;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .maintenance-logo-box {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .maintenance-logo {
            height: 175px;
            width: auto;
            max-width: 90vw;
            object-fit: contain;
            background: transparent;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.95))
                    drop-shadow(0 0 24px rgba(234, 88, 12, 0.45))
                    drop-shadow(0 0 40px rgba(223, 183, 108, 0.3));
            animation: logoFloat 4.5s ease-in-out infinite alternate;
        }

        @keyframes logoFloat {
            0% {
                transform: translateY(0px) scale(1);
            }
            100% {
                transform: translateY(-7px) scale(1.02);
            }
        }

        .maintenance-title {
            font-size: clamp(2.1rem, 5vw, 3rem);
            font-weight: 900;
            line-height: 1.3;
            margin-bottom: 1.25rem;
            background: linear-gradient(135deg, #ffffff 0%, var(--gold-light) 45%, var(--orange-bright) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(234, 88, 12, 0.22);
            letter-spacing: -0.3px;
        }

        .maintenance-description {
            font-size: clamp(1rem, 2.5vw, 1.18rem);
            font-weight: 600;
            color: var(--text-white);
            line-height: 1.85;
            margin-bottom: 0.65rem;
            opacity: 0.95;
        }

        .maintenance-thanks {
            font-size: clamp(0.98rem, 2.3vw, 1.12rem);
            font-weight: 700;
            color: var(--gold-light);
            line-height: 1.7;
            margin-top: 0.25rem;
        }

        .maintenance-divider {
            width: 72px;
            height: 3px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), var(--orange-bright), transparent);
            margin: 1.4rem auto 0;
            opacity: 0.75;
        }

        @media (max-width: 560px) {
            .maintenance-logo {
                height: 145px;
            }
            .maintenance-wrapper {
                padding: 1.5rem 1.15rem;
            }
        }
    </style>
</head>
<body>
    <main class="maintenance-wrapper" role="main">
        <div class="maintenance-logo-box">
            <img src="/assets/logo.png" alt="شعار وسيط - WASEET" class="maintenance-logo" onerror="this.onerror=null;this.src='assets/logo.png';">
        </div>

        <h1 class="maintenance-title">سنعود قريباً.</h1>

        <p class="maintenance-description">
            موقع وسيط متوقف مؤقتاً للصيانة. يرجى معاودة الزيارة قريباً.
        </p>
        <p class="maintenance-thanks">
            شكراً لصبركم.
        </p>

        <div class="maintenance-divider" aria-hidden="true"></div>
    </main>
</body>
</html>
