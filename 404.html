<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها - منصة وسيط (WASEET) للوساطة الآمنة.">
    <title>404 - الصفحة غير موجودة | وسيط - WASEET</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@600;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Favicon / أيقونة الموقع وشعار وسيط الناري (W) الموحد -->
        <!-- Favicon / أيقونة الموقع وشعار وسيط الناري (W) الموحد -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/favicon-32x32.png?v=20261108_w2">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicons/favicon-16x16.png?v=20261108_w2">
    <link rel="icon" type="image/x-icon" href="assets/favicons/favicon.ico?v=20261108_w2">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=20261108_w2">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261108_w2">
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg?v=20261108_w2">
    <link rel="apple-touch-icon" href="assets/favicons/apple-touch-icon.png?v=20261108_w2">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon.png?v=20261108_w2">
    <meta name="theme-color" content="#000000">

    <style>
        :root {
            --bg-black: #000000;
            --gold-primary: #c5a059;
            --gold-light: #dfb76c;
            --orange-primary: #ea580c;
            --orange-bright: #ff6a00;
            --text-white: #f8fafc;
            --text-muted: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Tajawal', 'Cairo', system-ui, -apple-system, sans-serif;
            direction: rtl;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* إضاءة محيطية خفيفة بدون تجاوز حدود العرض على الهواتف */
        body::before {
            content: "";
            position: absolute;
            width: 520px;
            max-width: 90vw;
            height: 520px;
            max-height: 90vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(234, 88, 12, 0.08) 0%, rgba(197, 160, 89, 0.05) 40%, rgba(0, 0, 0, 0) 72%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .notfound-wrapper {
            position: relative;
            z-index: 1;
            max-width: 620px;
            width: 100%;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .notfound-logo-box {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notfound-logo {
            height: 140px;
            width: auto;
            max-width: 85vw;
            object-fit: contain;
            background: transparent;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.95))
                    drop-shadow(0 0 24px rgba(234, 88, 12, 0.45))
                    drop-shadow(0 0 40px rgba(223, 183, 108, 0.3));
            animation: logoFloat 4.5s ease-in-out infinite alternate;
        }

        @keyframes logoFloat {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-7px) scale(1.02); }
        }

        .error-code {
            font-family: 'Orbitron', monospace;
            font-size: clamp(3rem, 8vw, 4.5rem);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 0%, var(--gold-light) 45%, var(--orange-bright) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(234, 88, 12, 0.3);
            letter-spacing: 2px;
        }

        .notfound-title {
            font-size: clamp(1.4rem, 4vw, 1.85rem);
            font-weight: 800;
            line-height: 1.35;
            margin-bottom: 0.8rem;
            color: #fff;
        }

        .notfound-description {
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
            font-weight: 500;
            color: var(--text-muted);
            line-height: 1.75;
            margin-bottom: 1.8rem;
            max-width: 480px;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.75rem 1.6rem;
            font-size: 1rem;
            font-weight: 700;
            color: #000;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 100%);
            border: 1px solid var(--gold-light);
            border-radius: 999px;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(197, 160, 89, 0.35);
            transition: all 0.25s ease;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(197, 160, 89, 0.55);
            background: linear-gradient(135deg, #fff 0%, var(--gold-light) 100%);
        }

        .notfound-divider {
            width: 72px;
            height: 3px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), var(--orange-bright), transparent);
            margin: 2rem auto 0;
            opacity: 0.75;
        }

        @media (max-width: 560px) {
            .notfound-logo { height: 115px; }
            .notfound-wrapper { padding: 1.5rem 1.15rem; }
        }
    </style>
</head>
<body>
    <main class="notfound-wrapper" role="main">
        <div class="notfound-logo-box">
            <img src="/assets/logo.png" alt="شعار وسيط - WASEET" class="notfound-logo" onerror="this.onerror=null;this.src='assets/logo.png';">
        </div>

        <div class="error-code">404</div>
        <h1 class="notfound-title">الصفحة غير موجودة</h1>

        <p class="notfound-description">
            عذراً، الصفحة التي تحاول الوصول إليها قد تكون حُذفت، أو تغيّر اسمها، أو غير متاحة مؤقتاً.
        </p>

        <a href="/" class="btn-home">
            <i class="fas fa-home"></i>
            العودة إلى الصفحة الرئيسية
        </a>

        <div class="notfound-divider" aria-hidden="true"></div>
    </main>
</body>
</html>
