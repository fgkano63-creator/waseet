  /* Grade Badge Overlay: الصف الرابع */
  .grade-badge-overlay {
    position: absolute;
    top: 224px;
    left: 172px;
    width: 338px;
    height: 52px;
    background: linear-gradient(180deg, #dd6772 0%, #cb4b56 50%, #b23541 100%);
    border: 2px solid #c9a358;
    border-radius: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.45), inset 0 -2px 4px rgba(0,0,0,0.3), 0 3px 8px rgba(0,0,0,0.15);
    z-index: 20;
  }
  .grade-badge-overlay::before, .grade-badge-overlay::after {
    content: '';
    position: absolute;
    width: 7px;
    height: 7px;
    background: #f7de9c;
    border-radius: 50%;
    box-shadow: 0 0 2px rgba(0,0,0,0.4);
  }
  .grade-badge-overlay::before { left: 14px; }
  .grade-badge-overlay::after { right: 14px; }

  .grade-badge-overlay span {
    color: #ffffff;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.35);
    margin-top: -3px;
  }

  /* Table Subject Cells */
  .subject-cell {
    position: absolute;
    left: 236px;
    width: 217px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    font-weight: 800;
    color: #041935;
    background: #fdf8f2;
    z-index: 10;
  }
  
  .subject-cell.english {
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  @media print {
    body {
      background: none;
    }
    .schedule-container {
      width: 100vw;
      height: 100vh;
      background-size: 100% 100%;
    }
  }
</style>
